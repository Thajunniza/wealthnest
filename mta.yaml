_schema-version: 3.3.0
ID: wealthnest
description: Financial Journey.
version: 1.0.0
modules:
  # --------------------- SERVER MODULE ------------------------
  - name: wealthnest-srv
    # ------------------------------------------------------------ 
    type: nodejs
    path: gen/srv
    requires:
      - name: wealthnest-auth
      - name: wealthnest-db
      - name: wealthnest-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  # ------------------------- DB DEPLOYER MODULE ---------------
  - name: wealthnest-db-deployer
    # ------------------------------------------------------------
    type: hdb
    path: gen/db
    requires:
      - name: wealthnest-db
      - name: wealthnest-auth
    parameters:
      buildpack: nodejs_buildpack

  # -------------------- DESTINATION CONTENT--------------------    
  - name: wealthnest-destination-content
    # ------------------------------------------------------------ 
    type: com.sap.application.content
    requires:
      - name: srv-api
      - name: wealthnest-destination
        parameters:
          content-target: true
      - name: wealthnest-html5-repo-host
        parameters:
          service-key:
            name: wealthnest-html5-repo-host-key
      - name: wealthnest-auth
        parameters:
          service-key:
            name: wealthnest-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: wealthnest-srv-api
              TokenServiceInstanceName: wealthnest-auth
              TokenServiceKeyName: wealthnest-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: cpapp.service
            - Authentication: OAuth2UserTokenExchange
              Name: wealthnest_wealthnest_auth
              ServiceInstanceName: wealthnest-auth
              ServiceKeyName: wealthnest-auth-key
              sap.cloud.service: wealthnest
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: wealthnest-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: wealthnest-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:


resources:
  # ----------------------- UAA SERVICE ------------------------
  - name: wealthnest-auth
    # ------------------------------------------------------------  
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: wealthnest-auth
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    # ------------------------- DB  MODULE -----------------------    
  - name: wealthnest-db
    # ------------------------------------------------------------
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      properties:
        hdi-service-name: ${service-name}
    # -------------------- DESTINATION SERVICE -------------------      
  - name: wealthnest-destination
    # ------------------------------------------------------------ 
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: wealthnest-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
      service: destination
      service-plan: lite
      service-name: wealthnest-destination-service

  # -------------------HTML 5 Repo Host-------------------------
  - name: wealthnest-html5-repo-host
    # ------------------------------------------------------------ 
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
